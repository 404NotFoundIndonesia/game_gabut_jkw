# Requires a shared Traefik instance to be running first:
#   cd traefik/ && docker compose up -d
#
# Setup:
#   1. cp .env.example .env
#   2. Edit .env
#   3. docker compose up -d
#
# The `traefik_public` network is owned by traefik/docker-compose.yml.
# This file only declares it as external — it never creates or destroys it.

x-restart: &restart
  restart: unless-stopped

name: bot-game-management-traefik

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    env_file:
      - .env
    environment:
      APP_ENV: production
      DB_DSN: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/bot_game_management?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    <<: *restart
    networks:
      - traefik_public
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_public"
      - "traefik.http.routers.game-gabut-jkw.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.game-gabut-jkw.entrypoints=websecure"
      - "traefik.http.routers.game-gabut-jkw.tls.certresolver=letsencrypt"
      - "traefik.http.routers.game-gabut-jkw.service=game-gabut-jkw-svc"
      - "traefik.http.routers.game-gabut-jkw.middlewares=security-headers@docker"
      - "traefik.http.services.game-gabut-jkw-svc.loadbalancer.server.port=8001"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bot_game_management
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *restart
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *restart
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
  proxy:
    driver: bridge
